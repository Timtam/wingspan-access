## The settings Wingspan Access needs. BepInEx adds all other settings with their defaults when
## the game starts for the first time.

[Logging.Console]

## No console window: it would take the focus away from the game.
Enabled = false

[Logging.Disk]

## Unity's messages in LogOutput.log, written at once, make bug reports useful.
WriteUnityLog = true
InstantFlushing = true
